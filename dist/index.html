<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f9eee9"><title>A little sorry ♡</title><style>
*{box-sizing:border-box}body{margin:0;background:#f9eee9;color:#532f37;font-family:Georgia,serif;min-height:100svh;display:grid;place-items:center;overflow-x:hidden}main{text-align:center;width:min(650px,90vw);padding:50px 16px} .eyebrow{font:600 11px Arial,sans-serif;letter-spacing:4px;text-transform:uppercase;color:#a67178}.heart{width:120px;height:120px;margin:48px auto 32px;position:relative;display:grid;place-items:center;font-size:90px;color:#d55770;transform:rotate(-8deg);filter:drop-shadow(5px 8px 0 #e9c6c5)}.heart:after{content:'✦';position:absolute;right:-24px;top:0;font-size:33px;color:#c99850}h1{font-size:clamp(36px,6vw,60px);line-height:1.12;letter-spacing:-2px;margin:0;font-weight:800}h1 em{color:#c45168;font-style:italic}p{font:16px/1.7 Arial,sans-serif;color:#976e76;margin:24px 0 30px}.buttons{display:flex;justify-content:center;gap:18px;min-height:66px}button{font:700 18px Arial,sans-serif;border-radius:99px;padding:18px 39px;cursor:pointer;touch-action:manipulation;border:2px solid #6a3c46;box-shadow:0 5px 0 #6a3c46;transition:transform .15s}button:focus-visible{outline:3px solid #7b69bd;outline-offset:6px}#yes{background:#cf5871;color:white;border-color:#a43e54;box-shadow:0 5px 0 #a43e54}#yes:hover{transform:rotate(-4deg) scale(1.06)}#no{background:#fff8f3;color:#6a3c46;z-index:5}footer{margin-top:45px;font:12px Arial,sans-serif;color:#b28b91}.confetti{position:fixed;top:-40px;font-size:24px;pointer-events:none;animation:fall 3s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(300deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main><div class="eyebrow">A little note, from the heart</div><div class="heart" aria-hidden="true">♥</div><h1>I'm sorry,<br>please forgive me,<br><em>do you forgive me?</em></h1><p id="message" aria-live="polite">One little question. A whole lot of hope.</p><div class="buttons"><button id="yes">yes ♡</button><button id="no">no</button></div><footer id="hint">Psst… the “no” button is a little shy.</footer></main><script>
const no=document.querySelector('#no'),yes=document.querySelector('#yes');let forgiven=false;
function run(e){if(forgiven)return;if(e)e.preventDefault();const r=no.getBoundingClientRect(),w=innerWidth,h=innerHeight,yr=yes.getBoundingClientRect();let x=16,y=16;for(let i=0;i<40;i++){x=16+Math.random()*Math.max(0,w-r.width-32);y=16+Math.random()*Math.max(0,h-r.height-32);if(Math.hypot(x-r.x,y-r.y)>130&&!(x<yr.right+20&&x+r.width>yr.left-20&&y<yr.bottom+20&&y+r.height>yr.top-20))break;}no.style.position='fixed';no.style.left=x+'px';no.style.top=y+'px';document.querySelector('#hint').textContent='Oops! There it goes again…';}
no.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse')run(e)});no.addEventListener('pointerdown',run);no.addEventListener('click',run);window.addEventListener('resize',()=>{no.style.position='';no.style.left='';no.style.top=''});
yes.addEventListener('click',()=>{forgiven=true;document.querySelector('h1').innerHTML='You just made<br><em>my heart happy.</em>';document.querySelector('#message').textContent='Thank you for forgiving me. It means so much. ♡';document.querySelector('.heart').textContent='♥';document.querySelector('.buttons').hidden=true;no.hidden=true;yes.hidden=true;document.querySelector('#hint').textContent='A fresh start, with a little more love.';if(!matchMedia('(prefers-reduced-motion: reduce)').matches)for(let i=0;i<35;i++){const c=document.createElement('span');c.className='confetti';c.textContent=['♥','✦','♡'][i%3];c.style.left=Math.random()*100+'vw';c.style.color=['#cf5871','#c99850','#a67178'][i%3];c.style.animationDelay=Math.random()+'s';document.body.append(c);setTimeout(()=>c.remove(),4500)}});
</script></body></html>
